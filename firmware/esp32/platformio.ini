; No de telemetria embarcada (Secao B do escopo do PFE II): ESP32 + GPS
; NEO-6M + acelerometro MPU-6050, deteccao de eventos por limiar e
; store-and-forward via LittleFS + MQTT (QoS 1, sessao persistente).
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    rfetick/MPU6050_light @ ^1.1.0
    256dpi/MQTT @ ^2.5.1
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -std=gnu++17
build_src_filter = +<*> -<i2c_scanner.cpp>

; --- Ambiente TEMPORARIO de diagnostico -------------------------------------
; Varre o barramento I2C e lista os enderecos que respondem, para descobrir por
; que o MPU-6050 nao responde. Nao faz parte do firmware: depois do diagnostico
; da para apagar este bloco junto com src/i2c_scanner.cpp.
[env:scanner_i2c]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<i2c_scanner.cpp>
lib_deps =
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
